[package]
name = "arbitrage-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"

# Sui SDK
sui-sdk = { git = "https://github.com/mystenlabs/sui", package = "sui-sdk" }

# Web
reqwest = "0.12.26"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"

# WebSocket
tokio-tungstenite = "0.28"
futures-util = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "2.0.17"

# Utilities
chrono = "0.4"
rust_decimal = "1.33"
rust_decimal_macros = "1.33"
arc-swap = "1.7"

# Logging
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Config
config = "0.15.19"
dotenv = "0.15"
futures = "0.3.31"
once_cell = "1.21.3"
mem = "0.5.0"
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"

[dev-dependencies]
mockito = "1.7.1"
